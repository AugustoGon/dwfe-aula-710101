<!doctype html>
<html>

<head>

  <link rel="stylesheet" href="./assets/css/home/estilo.css">

  <script src="./assets/js/home.js" type="model"></script>


</head>

<body>
  <header>
    <div class="logo">A</div>
    <h1 class="titulo">Meu Site de Notícias</h1>
    <div class="menu-hamburguer" onclick="alternarVisualizacaoDoMenuLateral()">
      <i class="fa-solid fa-bars"></i>
    </div>
  </header>
  <section>
    <nav>
      <ui class="menu-lateral">
        <li id="opcao_noticia">
          <a href="" onclick="apresentarNoticias()">
            <div class="opcao">
              <div class="icone-inicial">
                <i class="fa-solid fa-newspaper"></i>
              </div>
              <div class="rotulo">Notícias</div>
              <div class="icone-final">
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </div>
          </a>
        </li>
        <li>
          <a href="#">
            <div class="opcao">
              <div class="icone-inicial">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <div class="rotulo">Contato</div>

                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </div>
          </a>
        </li>
        <li>
          <a href="#">
            <div class="opcao">
              <div class="icone-inicial">
                <i class="fa-solid fa-user"></i>
              </div>
              <div class="rotulo">Perfil</div>
              <div class="icone-final">
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </div>
          </a>
        </li>
        <li>
          <a href="./index.html">
            <div class="opcao">
              <div class="icone-inicial">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
              </div>
              <div class="rotulo">Sair</div>
              <div class="icone-final">
                <i class="fa-solid fa-chevron-right"></i>
              </div>
            </div>
          </a>
        </li>
      </ui>
    </nav>
  </section>


  <main class="container" id="noticias">

  </main>

  <footer>
    &copy; Meu Site de Notícias ❤️
  </footer>

  <script src="./assets/js/menu-hamburguer.js"></script>

</html>
