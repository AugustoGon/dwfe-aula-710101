<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Notícias</title>
    <link rel="stylesheet" href="./assets/css/estilo.css">
    <script src="https://kit.fontawesome.com/7212f70d6d.js" crossorigin="anonymous"></script>
    <script src="./assets/js/login.js"></script>
</head>

<body>
    <header class="header-login">
        <div class="logo">A</div>
        <h1 class="titulo">Meu Site de Notícias</h1>
        <div class="menu-hamburguer" onclick="alternarVisualizacaoDoMenuLateral()">
            <i class="fa-solid fa-bars"></i>
        </div>
    </header>

    <div class="container-login">
        <h1>Login</h1>
        <form>
            <input type="text" placeholder="Informe seu e-mail" id="email">
            
            <input type="password" placeholder="Informe sua senha" id="senha">
            
            <br>

            <button type="button" onclick="verificarCredenciais(); return false;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                Entrar
            </button>

            <p>
                <a href="#">Esqueci a senha</a>
                .
                <a href="#">Registre-se</a>
            </p>

        </form>
    </div>
</body>

</html>
